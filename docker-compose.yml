services:
  pdfmathtranslate-web:
    build:
      context: .
      dockerfile: Dockerfile
    # 也可以直接拉取 GitHub Actions 自动构建的镜像（请替换为你的 GitHub 用户名）:
    # image: ghcr.io/<your-github-username>/pdfmathtranslate-web:latest
    container_name: pdfmathtranslate-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 持久化上传文件及翻译产物
      - ./data:/app/data
      # 持久化字体与模型缓存，避免重复下载
      - babeldoc-cache:/root/.cache/babeldoc
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  babeldoc-cache:
