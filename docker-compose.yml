services:
  pdfmathtranslate-web:
    image: ghcr.io/svefnz/pdfmathtranslate-web:latest
    # 若需本地从源码重新编译，可取消下方 build 注释:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: pdfmathtranslate-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 持久化上传文件及翻译产物
      - ./data:/app/data
      # 持久化字体与模型缓存，避免重复下载
      - babeldoc-cache:/root/.cache/babeldoc
      # 方式 1：挂载用户认证文件（兼容上游 auth.txt 格式：admin,password123）
      # - ./data/auth.txt:/app/data/auth.txt
    environment:
      - PYTHONUNBUFFERED=1
      # 方式 2：或者直接通过环境变量配置用户名和密码（多个用户用逗号或分号分隔）
      # - AUTH_USERS=admin:password123,guest:guest123

volumes:
  babeldoc-cache:
